    }).join('') +
    '<p class="small muted" style="line-height:1.7">ログインは不要です。「気になる」の記録はこの端末にだけ保存されます。</p></div>' +
    '<button type="button" class="primary" style="height:52px;border-radius:26px;font-size:16px;margin-top:24px" data-act="start">はじめる</button></div>';
}

function vHome() {
  var during = S.phase === '選挙期間中', after = S.phase === '投票終了後';
  var label = none() ? 'いまは選挙期間ではありません' : (after ? '投票は終わりました（サンプル）' : '投票日 2026年12月6日（日）（サンプル）');
  var name = none() ? '政党の主張を、いつでも読めます' : '第〇〇回 衆議院議員総選挙 ・ 〇〇県第1区';
  var note = none() ? '次の選挙が決まると、候補者の主張も追加されます。' : (after ? '「振り返り」で、結果と候補者別の「気になる」の割合を見られます。' : '国会に議席がある4つの政党と、この選挙区の候補者3人の主張を紹介しています。');
  var h = '<div class="pad"><div class="card" style="gap:6px"><p class="small muted">' + label + '</p><p style="font-size:18px;font-weight:700;line-height:1.5">' + name + '</p><p style="font-size:13px;line-height:1.7;color:#3A3A44">' + note + '</p></div>';
  h += '<div style="display:flex;flex-direction:column;gap:4px"><h2>気になる話題からえらぶ</h2><p class="small muted">アプリ利用者 ' + fmt(TOTAL) + '人のうち、その話題の主張に「気になる」を付けた人の割合</p></div><div style="display:flex;flex-direction:column;gap:10px">';
  TOPICS.forEach(function (t) {
    var n = CLAIMS.filter(function (c) { return c.topic === t.id && visible(c); }).length;
    h += '<button type="button" class="topic-btn" data-act="topic" data-arg="' + t.id + '"><span style="display:flex;justify-content:space-between;align-items:baseline;width:100%"><span style="font-size:16px;font-weight:700">' + t.name + '</span><span style="font-size:20px;font-weight:700;color:#2451B7">' + pct(t.liked) + '%</span></span><span style="width:100%">' + bar(pct(t.liked)) + '</span><span class="small muted">' + fmt(TOTAL) + '人中 ' + fmt(t.liked) + '人 ・ 主張 ' + n + '件</span></button>';
  });
  h += '</div><div class="card" style="gap:4px;padding:8px 16px"><button type="button" class="link-btn" data-act="why" aria-expanded="' + S.showWhy + '">候補者別・政党別の割合が出ないのはなぜ？</button>';
  if (S.showWhy) h += '<p style="font-size:13px;line-height:1.8;color:#3A3A44;padding-bottom:8px">法律（公職選挙法）で、選挙の当選者を予想する人気投票の結果を公表することが禁止されています。そのため、候補者別・政党別の割合は、投票が終わった選挙についてだけ「振り返り」で見られます。</p>';
  return h + '</div></div>';
}

function vTopic() {
  var t = TOPICS.filter(function (x) { return x.id === S.topicId; })[0];
  var claims = CLAIMS.filter(function (c) { return c.topic === S.topicId && visible(c); }).sort(function (a, b) { return S.order.indexOf(a.id) - S.order.indexOf(b.id); });
  var canComment = CLAIMS.some(function (c) { return c.topic === S.topicId && !c.past && isLiked(c.id); });
  var h = '<div class="pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><p style="font-size:13px;line-height:1.6;color:#3A3A44">アプリ利用者の <b style="color:#2451B7;font-size:16px">' + pct(t.liked) + '%</b>（' + fmt(TOTAL) + '人中 ' + fmt(t.liked) + '人）がこの話題を気にしています</p><button type="button" class="ghost" style="height:40px;flex-shrink:0;font-size:13px" data-act="shareTopic">シェア</button></div>';
  h += '<p class="small muted">並び順は開くたびにランダムです</p><div style="display:flex;flex-direction:column;gap:12px">';
  claims.forEach(function (c) {
    h += '<div class="card"><div style="display:flex;gap:8px;align-items:center"><span class="chip">' + whoType(c) + '</span><span style="font-size:13px;color:#3A3A44">' + esc(whoLabel(c)) + '</span></div><p style="font-size:16px;font-weight:700;line-height:1.55">' + esc(c.title) + '</p><div style="display:flex;gap:8px">' + likeBtn(c) + '<button type="button" class="ghost" style="flex:1" data-act="claim" data-arg="' + c.id + '">どう変わる？</button></div></div>';
  });
  h += '</div><div style="display:flex;flex-direction:column;gap:10px;padding-top:8px"><h2>みんなのコメント（匿名）</h2>';
  if (!canComment) {
    h += '<div style="background:#FFF4EC;border-radius:12px;padding:14px 16px"><p style="font-size:13px;line-height:1.7;color:#3A3A44">この話題の主張に「気になる」を付けると、コメントを書けるようになります。</p></div>';
  } else {
    h += '<div class="card" style="padding:12px;gap:8px"><label for="draft" class="small muted">この話題について、自分の生活で感じることを書いてみよう</label><textarea id="draft" rows="3" placeholder="例：部活が地域クラブになったら、送り迎えが心配" style="width:100%;border:1px solid #C9CCD6;border-radius:10px;padding:10px;font-size:14px;line-height:1.6;resize:none">' + esc(S.draft) + '</textarea><p style="font-size:11px;line-height:1.6" class="muted">投票の呼びかけ・個人情報・人を傷つける表現は、AIが見つけて人が確認してから公開します。</p><button type="button" class="primary" style="align-self:flex-end;height:40px;font-size:14px" data-act="post">投稿する</button></div>';
  }
  S.myComments.filter(function (m) { return m.topic === S.topicId; }).forEach(function (m) {
    h += '<div style="background:#fff;border:1px dashed #9AA3BF;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:700;color:#2451B7">あなたのコメント ・ ' + m.status + '</span><button type="button" class="text-btn" data-act="delComment" data-arg="' + m.id + '">削除</button></div><p style="font-size:14px;line-height:1.6">' + esc(m.text) + '</p>' + (m.reason ? '<p style="font-size:12px;line-height:1.6;color:#8A3A08">確認待ち：' + m.reason + '。人が確認するまで、ほかの人には見えません。</p>' : '') + '</div>';
  });
  (COMMENTS[S.topicId] || []).forEach(function (text, i) {
    var key = S.topicId + i;
    h += '<div style="background:#fff;border:1px solid #E2E2DC;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px"><p style="font-size:14px;line-height:1.6">' + esc(text) + '</p><div style="display:flex;justify-content:flex-end"><button type="button" class="text-btn" data-act="report" data-arg="' + key + '">' + (S.reported[key] ? '通報しました' : '通報する') + '</button></div></div>';
  });
  return h + '</div></div>';
}

function vClaim() {
  var c = byId(S.claimId), f = FIGS[c.id], during = S.phase === '選挙期間中';
  var h = '<div class="pad" style="gap:14px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip blue">' + topicName(c.topic) + '</span><span class="chip">' + whoType(c) + '</span><span style="font-size:13px;color:#3A3A44">' + esc(whoLabel(c)) + '</span></div>';
  h += '<h2 style="font-size:20px;line-height:1.5">' + esc(c.title) + '</h2>';
  h += '<div class="card" style="gap:12px"><p style="font-size:13px;font-weight:700;color:#2451B7">これで、どう変わるとされている？</p>';
  h += '<figure style="margin:0;display:flex;flex-direction:column;gap:8px"><div class="fig">' +
    '<div class="box now"><span class="tag" style="color:#5B5B66;background:#fff">いま</span><span style="font-size:18px;font-weight:700;line-height:1.35;color:#3A3A44">' + f[0] + '</span><span style="font-size:11px;line-height:1.5;color:#5B5B66">' + f[1] + '</span></div>' +
    '<div style="display:flex;align-items:center;justify-content:center;color:#B4470B"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></svg></div>' +
    '<div class="box next"><span class="tag" style="color:#fff;background:#B4470B">こうなる！</span><span style="font-size:20px;font-weight:700;line-height:1.35;color:#8A3A08">' + f[2] + '</span><span style="font-size:11px;line-height:1.5;color:#3A3A44">' + f[3] + '</span></div></div>' +
    '<figcaption style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span style="font-size:12px;color:#3A3A44">関係する人：<b>' + f[4] + '</b></span><span style="font-size:11px" class="muted">' + esc(c.who) + 'の主張をもとにしたイメージ図</span></figcaption></figure>';
  h += '<p style="font-size:15px;line-height:1.85">' + esc(c.image) + '</p>';
  h += '<div style="background:#F6F6F3;border-radius:10px;padding:10px 12px"><p style="font-size:12px;line-height:1.7;color:#3A3A44"><b>これは主張をもとに作成したイメージです。</b>アプリの予測ではありません。AIが下書きし、人が元資料と照らして確認しました。</p></div>';
  if (c.terms.length) {
    h += '<div style="display:flex;flex-direction:column;gap:6px"><p class="small muted">ことばをタップすると説明が出ます</p><div style="display:flex;gap:8px;flex-wrap:wrap">' + c.terms.map(function (k) {
      return '<button type="button" style="height:36px;padding:0 14px;border:1px dashed #2451B7;border-radius:18px;background:#fff;color:#2451B7;font-size:13px;cursor:pointer" data-act="term" data-arg="' + k + '">' + TERMS[k].word + '</button>';
    }).join('') + '</div></div>';
  }
  h += '</div><div class="card" style="gap:8px;padding:14px 16px"><p class="small muted">元資料</p><a href="#" onclick="return false" style="font-size:14px;line-height:1.6">' + esc(c.source) + '</a><p class="small muted">最終確認日：' + c.checked + '</p>';
  if (c.correction) h += '<div style="border-top:1px solid #E2E2DC;padding-top:8px"><p style="font-size:12px;font-weight:700;color:#3A3A44">訂正記録</p><p style="margin-top:4px;font-size:12px;line-height:1.7;color:#3A3A44">' + esc(c.correction) + '</p></div>';
  h += '</div>';
  if (c.prev) {
    h += '<div class="card" style="gap:4px;padding:8px 16px"><button type="button" class="link-btn" data-act="prev" aria-expanded="' + S.showPrev + '">前回の選挙での主張とくらべる</button>' + (S.showPrev ? '<p style="font-size:13px;line-height:1.7;color:#3A3A44;padding-bottom:8px">' + esc(c.prev) + '</p>' : '') + '</div>';
  }
  h += '<div style="display:flex;gap:8px">' + likeBtn(c, true) + (during ? '' : '<button type="button" class="ghost" style="height:48px;border-radius:24px" data-act="shareClaim">シェア</button>') + '</div>';
  if (during) h += '<p style="font-size:12px;line-height:1.7" class="muted">選挙期間中は、候補者・政党の主張はシェアできません。18歳未満は選挙運動ができないため、知らないうちに違反しないようにしています。話題（' + topicName(c.topic) + '）のシェアはできます。</p>';
  return h + '</div>';
}

function vStock() {
  var list = CLAIMS.filter(function (c) { return isLiked(c.id) && (S.stockFilter === 'all' || c.topic === S.stockFilter); });
  var h = '<div class="pad" style="gap:14px"><p class="small muted" style="line-height:1.6">ストックはこの端末にだけ保存されます。だれにも見られません。</p><div class="filters">';
  [{ id: 'all', name: 'すべて' }].concat(TOPICS).forEach(function (f) {
    h += '<button type="button" aria-pressed="' + (S.stockFilter === f.id) + '" data-act="filter" data-arg="' + f.id + '">' + f.name + '</button>';
  });
  h += '</div>';
  if (!list.length) h += '<p style="font-size:14px;line-height:1.7;padding:24px 0;text-align:center" class="muted">まだストックがありません。<br>主張に「気になる」を付けると、ここに集まります。</p>';
  list.forEach(function (c) {
    h += '<button type="button" class="topic-btn" style="gap:6px" data-act="claim" data-arg="' + (c.past ? c.replacedBy : c.id) + '"><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip blue">' + topicName(c.topic) + '</span>' + (c.past ? '<span class="chip">過去の主張（' + c.pastYear + '年）・新しい主張があります</span>' : '') + (c.correction ? '<span class="chip warm">訂正あり</span>' : '') + '</span><span style="font-size:15px;font-weight:700;line-height:1.5">' + esc(c.title) + '</span><span class="small muted">' + esc(whoLabel(c)) + '</span></button>';
  });
  return h + '</div>';
}

function vReview() {
  if (S.phase !== '投票終了後') {
    return '<div class="pad"><div class="card" style="padding:20px"><p style="font-size:16px;font-weight:700">振り返りは、投票が終わってから開きます</p><p style="font-size:13px;line-height:1.8;color:#3A3A44">選挙の結果と、あなたが気になった主張、候補者別・政党別の「気になる」の割合をまとめて見られます。投票前に候補者別の割合を出すことは、法律（公職選挙法）で禁じられた人気投票の公表にあたるおそれがあるため、投票締め切り（20時）まで公開しません。</p></div></div>';
  }
  var h = '<div class="pad"><div class="card" style="gap:4px"><p class="small muted">投票終了（サンプル）</p><p style="font-size:17px;font-weight:700">第〇〇回 衆議院議員総選挙 ・ 〇〇県第1区</p></div>';
  h += '<div style="display:flex;flex-direction:column;gap:8px"><h2>あなたが気になった主張の候補者</h2>';
  var mine = CLAIMS.filter(function (c) { return c.by === 'candidate' && isLiked(c.id); });
  if (!mine.length) h += '<p style="font-size:13px" class="muted">候補者の主張には、まだ「気になる」を付けていません。</p>';
  mine.forEach(function (c) {
    var cand = CANDIDATES.filter(function (x) { return x.name === c.who; })[0];
    h += '<div class="card" style="flex-direction:row;justify-content:space-between;align-items:center;padding:12px 16px"><span style="display:flex;flex-direction:column;gap:2px"><b style="font-size:15px">' + c.who + '</b><span class="small muted">' + esc(c.title) + '</span></span><span class="chip" style="font-size:13px;padding:4px 10px;flex-shrink:0">' + (cand ? cand.result : '') + '</span></div>';
  });
  h += '</div><div style="display:flex;flex-direction:column;gap:8px"><h2>候補者別の「気になる」の割合</h2><p class="small muted">アプリ利用者 ' + fmt(TOTAL) + '人のうち、その候補者の主張に「気になる」を付けた人</p>';
  CANDIDATES.forEach(function (c) {
    h += '<div class="card" style="gap:6px;padding:12px 16px"><span style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:700">' + c.name + ' <span style="font-size:12px;font-weight:400" class="muted">' + c.party + ' ・ ' + c.result + '</span></span><span style="font-size:17px;font-weight:700;color:#2451B7">' + pct(c.liked) + '%</span></span>' + bar(pct(c.liked)) + '</div>';
  });
  h += '</div><div style="display:flex;flex-direction:column;gap:8px"><h2>政党別の「気になる」の割合</h2>';
  PARTIES.forEach(function (p) {
    h += '<div class="card" style="gap:6px;padding:12px 16px"><span style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:700">' + p.name + '</span><span style="font-size:17px;font-weight:700;color:#2451B7">' + pct(p.liked) + '%</span></span>' + bar(pct(p.liked)) + '</div>';
  });
  return h + '</div></div>';
}

function render() {
  var app = document.getElementById('app');
  var scrollEl = app.querySelector('.body');
  var keepScroll = render._same && scrollEl ? scrollEl.scrollTop : 0;
  var h = '';
  if (S.screen === 'intro') {
    h = vIntro();
  } else {
    var titles = { home: 'ホーム', topic: topicName(S.topicId), claim: '主張のくわしい説明', stock: 'ストック', review: '振り返り' };
    h += '<div class="hdr">' + (S.history.length ? '<button type="button" class="icon-btn" aria-label="もどる" data-act="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>' : '') + '<h1>' + titles[S.screen] + '</h1><span class="phase">' + S.phase + '</span></div>';
    h += '<div class="body">' + ({ home: vHome, topic: vTopic, claim: vClaim, stock: vStock, review: vReview })[S.screen]() + '</div>';
    var tab = S.screen === 'stock' || S.screen === 'review' ? S.screen : 'home';
    var count = CLAIMS.filter(function (c) { return isLiked(c.id); }).length;
    h += '<nav class="tabs" aria-label="メインメニュー">' + [['home', 'ホーム'], ['stock', 'ストック ' + count], ['review', '振り返り']].map(function (t) {
      return '<button type="button" data-act="tab" data-arg="' + t[0] + '"' + (tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + '</button>';
    }).join('') + '</nav>';
  }
  if (S.sheet) h += '<div class="sheet-bg" data-act="closeSheet"><div class="sheet" role="dialog" aria-label="ことばの説明" onclick="event.stopPropagation()"><p style="font-size:18px;font-weight:700">' + S.sheet.word + '</p><p style="font-size:15px;line-height:1.8">' + S.sheet.text + '</p><button type="button" class="ghost" style="margin-top:8px;height:48px;border-radius:24px;font-size:15px" data-act="closeSheet">とじる</button></div></div>';
  if (S.toast) h += '<div class="toast" role="status">' + esc(S.toast) + '</div>';
  app.innerHTML = h;
  var nb = app.querySelector('.body');
  if (nb) nb.scrollTop = keepScroll;
  var ta = document.getElementById('draft');
  if (ta) ta.addEventListener('input', function () { S.draft = ta.value; });
}

function go(screen, extra) {
  var top = screen === 'home' || screen === 'stock' || screen === 'review';
  S.history = top ? [] : S.history.concat([{ screen: S.screen, topicId: S.topicId, claimId: S.claimId }]);
  S.screen = screen; S.sheet = null; S.showPrev = false;
  for (var k in (extra || {})) S[k] = extra[k];
  render._same = false; render();
}
function update() { render._same = true; render(); }
function flash(msg) {
  S.toast = msg; update();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { S.toast = ''; update(); }, 2600);
}

var ACTIONS = {
  start: function () { S.screen = 'home'; S.history = []; update(); },
  tab: function (a) { go(a); },
  topic: function (a) { go('topic', { topicId: a, draft: '' }); },
  claim: function (a) { go('claim', { claimId: a }); },
  back: function () { var last = S.history.pop(); if (last) { S.screen = last.screen; S.topicId = last.topicId; S.claimId = last.claimId; S.sheet = null; S.showPrev = false; } render._same = false; render(); },
  like: function (a) { S.likes = isLiked(a) ? S.likes.filter(function (x) { return x !== a; }) : S.likes.concat([a]); saveLikes(); update(); },
  why: function () { S.showWhy = !S.showWhy; update(); },
  prev: function () { S.showPrev = !S.showPrev; update(); },
  term: function (a) { S.sheet = TERMS[a]; update(); },
  closeSheet: function () { S.sheet = null; update(); },
  filter: function (a) { S.stockFilter = a; update(); },
  shareTopic: function () { flash('話題「' + topicName(S.topicId) + '」のリンクをコピーしました（プロトタイプ）'); },
  shareClaim: function () { flash('主張のリンクをコピーしました（プロトタイプ）'); },
  post: function () {
    var text = (S.draft || '').trim(); if (!text) return;
    var reason = judge(text);
    S.myComments.unshift({ id: S.seq++, topic: S.topicId, text: text, status: reason ? '確認待ち' : '公開中', reason: reason });
    S.draft = '';
    flash(reason ? '確認待ちになりました。人が確認してから公開されます。' : 'コメントを公開しました（匿名）');
  },
  delComment: function (a) { S.myComments = S.myComments.filter(function (m) { return String(m.id) !== a; }); update(); },
  report: function (a) { if (S.reported[a]) return; S.reported[a] = true; flash('通報を受け付けました。運営が確認します。'); }
};

document.getElementById('app').addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACTIONS[el.getAttribute('data-act')];
  if (fn) fn(el.getAttribute('data-arg'));
});
document.getElementById('phase').addEventListener('change', function (e) { S.phase = e.target.value; update(); });

render();
</script>
</body>
</html>
