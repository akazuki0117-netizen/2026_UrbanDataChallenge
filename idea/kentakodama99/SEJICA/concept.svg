<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>政治家になれる「SEJICA」（仮） コンセプト</title>
  <rect width="1200" height="675" fill="#f6f7fa"/>
  <circle cx="1130" cy="40" r="210" fill="#fbe5e1" opacity=".75"/>
  <circle cx="60" cy="660" r="150" fill="#e2eefc" opacity=".8"/>

  <!-- 左：コピー -->
  <rect x="64" y="64" width="380" height="36" rx="18" fill="#d94f3d"/>
  <text x="254" y="88" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">中高生向け　政治家になれる「SEJICA」（仮）</text>

  <text x="64" y="168" font-size="40" font-weight="800" fill="#1d2230">きみの主張、</text>
  <text x="64" y="224" font-size="40" font-weight="800" fill="#1d2230"><tspan fill="#d94f3d">政治家に通じるか？</tspan></text>
  <text x="64" y="270" font-size="18" fill="#6b7385">140字で主張して、AI政治家と3ターン議論する。</text>

  <!-- ステップ -->
  <g font-size="18" fill="#1d2230">
    <g transform="translate(64,318)">
      <rect width="520" height="64" rx="16" fill="#fff" stroke="#dfe3ea" stroke-width="2"/>
      <circle cx="34" cy="32" r="18" fill="#d94f3d"/>
      <text x="34" y="39" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text>
      <text x="66" y="29" font-weight="700">ランダムに出るテーマで、140字の主張を書く</text>
      <text x="66" y="51" font-size="14" fill="#8a8f9c">例：部活動の地域展開。引き直しは1回だけ</text>
    </g>
    <g transform="translate(64,396)">
      <rect width="520" height="64" rx="16" fill="#fff" stroke="#dfe3ea" stroke-width="2"/>
      <circle cx="34" cy="32" r="18" fill="#d94f3d"/>
      <text x="34" y="39" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text>
      <text x="66" y="29" font-weight="700">AI政治家を選んで、3ターン議論する</text>
      <text x="66" y="51" font-size="14" fill="#8a8f9c">やさしい・ふつう・きびしい。反論は統計の出典つき</text>
    </g>
    <g transform="translate(64,474)">
      <rect width="520" height="64" rx="16" fill="#fff" stroke="#dfe3ea" stroke-width="2"/>
      <circle cx="34" cy="32" r="18" fill="#d94f3d"/>
      <text x="34" y="39" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text>
      <text x="66" y="29" font-weight="700">主張点数・話し方のタイプ・政党との近さがわかる</text>
      <text x="66" y="51" font-size="14" fill="#8a8f9c">賛成か反対かでは点数は変わらない</text>
    </g>
  </g>

  <!-- 中央：スマホ（議論画面） -->
  <g transform="translate(632,70)">
    <rect width="236" height="470" rx="34" fill="#1d2230"/>
    <rect x="9" y="9" width="218" height="452" rx="26" fill="#fff"/>
    <rect x="9" y="9" width="218" height="50" rx="26" fill="#1d2230"/>
    <rect x="9" y="35" width="218" height="24" fill="#1d2230"/>
    <text x="24" y="40" font-size="12" fill="#9aa0ad">テーマ</text>
    <text x="64" y="40" font-size="13" font-weight="700" fill="#fff">部活動の地域展開</text>
    <text x="214" y="40" font-size="11" fill="#e0a526" text-anchor="end">2/3</text>

    <!-- 自分の主張 -->
    <rect x="62" y="74" width="150" height="76" rx="16" fill="#e2eefc"/>
    <text x="74" y="98" font-size="12" fill="#1d2230">先生の負担が減るので</text>
    <text x="74" y="118" font-size="12" fill="#1d2230">賛成。休日だけでも</text>
    <text x="74" y="138" font-size="12" fill="#1d2230">地域に任せたい</text>

    <!-- AI政治家の反論 -->
    <circle cx="30" cy="180" r="13" fill="#d94f3d"/>
    <text x="30" y="185" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">政</text>
    <rect x="48" y="166" width="164" height="118" rx="16" fill="#f1f2f5"/>
    <text x="60" y="190" font-size="12" fill="#1d2230">でも、地方では指導者が</text>
    <text x="60" y="210" font-size="12" fill="#1d2230">足りないという統計も</text>
    <text x="60" y="230" font-size="12" fill="#1d2230">あります。どう補う？</text>
    <rect x="60" y="244" width="140" height="26" rx="8" fill="#fff" stroke="#dfe3ea"/>
    <text x="130" y="262" font-size="11" fill="#2f7de1" text-anchor="middle">📊 出典：e-Stat</text>

    <!-- 入力欄 -->
    <rect x="20" y="340" width="196" height="76" rx="14" fill="#fff" stroke="#2f7de1" stroke-width="1.5"/>
    <text x="32" y="364" font-size="12" fill="#9aa0ad">再反論を書く…</text>
    <text x="204" y="404" font-size="11" fill="#9aa0ad" text-anchor="end">0 / 140</text>
    <rect x="20" y="424" width="196" height="26" rx="13" fill="#d94f3d"/>
    <text x="118" y="442" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">送る</text>
  </g>

  <!-- 矢印 -->
  <path d="M880 300 h22" stroke="#d94f3d" stroke-width="4" stroke-linecap="round"/>
  <path d="M898 290 l12 10 l-12 10" fill="none" stroke="#d94f3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右：結果カード -->
  <g transform="translate(922,110)">
    <rect width="226" height="390" rx="22" fill="#fff" stroke="#dfe3ea" stroke-width="2"/>
    <text x="113" y="40" font-size="13" fill="#8a8f9c" text-anchor="middle">主張点数</text>
    <text x="113" y="94" font-size="48" font-weight="800" fill="#d94f3d" text-anchor="middle">78<tspan font-size="18" fill="#6b7385"> 点</tspan></text>
    <rect x="48" y="108" width="130" height="28" rx="14" fill="#fff6e0"/>
    <text x="113" y="127" font-size="13" font-weight="700" fill="#e0a526" text-anchor="middle">データ派タイプ</text>

    <g font-size="12" fill="#1d2230">
      <text x="22" y="166">根拠</text><rect x="78" y="156" width="96" height="10" rx="5" fill="#eef0f4"/><rect x="78" y="156" width="80" height="10" rx="5" fill="#d94f3d"/><text x="204" y="166" text-anchor="end">21</text>
      <text x="22" y="190">具体性</text><rect x="78" y="180" width="96" height="10" rx="5" fill="#eef0f4"/><rect x="78" y="180" width="70" height="10" rx="5" fill="#d94f3d"/><text x="204" y="190" text-anchor="end">18</text>
      <text x="22" y="214">応答</text><rect x="78" y="204" width="96" height="10" rx="5" fill="#eef0f4"/><rect x="78" y="204" width="76" height="10" rx="5" fill="#d94f3d"/><text x="204" y="214" text-anchor="end">20</text>
      <text x="22" y="238">受け止め</text><rect x="78" y="228" width="96" height="10" rx="5" fill="#eef0f4"/><rect x="78" y="228" width="72" height="10" rx="5" fill="#d94f3d"/><text x="204" y="238" text-anchor="end">19</text>
    </g>

    <line x1="22" y1="258" x2="204" y2="258" stroke="#eef0f4" stroke-width="2"/>
    <text x="22" y="284" font-size="13" font-weight="700" fill="#1d2230">全政党との近さ</text>
    <g font-size="12" fill="#1d2230">
      <text x="22" y="310">A党</text><rect x="62" y="300" width="110" height="10" rx="5" fill="#eef0f4"/><rect x="62" y="300" width="88" height="10" rx="5" fill="#2f7de1"/>
      <text x="22" y="332">B党</text><rect x="62" y="322" width="110" height="10" rx="5" fill="#eef0f4"/><rect x="62" y="322" width="62" height="10" rx="5" fill="#7fb0ee"/>
      <text x="22" y="354">C党</text><rect x="62" y="344" width="110" height="10" rx="5" fill="#eef0f4"/><rect x="62" y="344" width="40" height="10" rx="5" fill="#7fb0ee"/>
    </g>
    <text x="113" y="378" font-size="11" fill="#8a8f9c" text-anchor="middle">※数字はイメージです</text>
  </g>

  <!-- フッター -->
  <rect x="0" y="600" width="1200" height="75" fill="#1d2230"/>
  <g font-size="16" fill="#fff" font-weight="700">
    <circle cx="92" cy="638" r="5" fill="#e0a526"/><text x="106" y="644">AI政治家は党に属さない</text>
    <circle cx="332" cy="638" r="5" fill="#e0a526"/><text x="346" y="644">反論は統計の出典つき</text>
    <circle cx="552" cy="638" r="5" fill="#e0a526"/><text x="566" y="644">きびしくても人格は否定しない</text>
    <circle cx="842" cy="638" r="5" fill="#e0a526"/><text x="856" y="644">シェアに党名は載せない</text>
  </g>
</svg>
