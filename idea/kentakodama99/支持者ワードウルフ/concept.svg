<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif">
  <title>支持者ワードウルフ（仮） コンセプト</title>
  <rect width="1200" height="675" fill="#f3f4f8"/>
  <circle cx="1130" cy="40" r="210" fill="#d9dce3" opacity=".7"/>
  <circle cx="60" cy="660" r="150" fill="#3ddc84" opacity=".16"/>

  <!-- 左：コピー -->
  <rect x="64" y="64" width="330" height="36" rx="18" fill="#1d2230"/>
  <text x="229" y="88" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">中高生向け　支持者ワードウルフ（仮）</text>

  <text x="64" y="168" font-size="40" font-weight="800" fill="#1d2230">一人だけ違う支持者がいるぞ！</text>
  <text x="64" y="224" font-size="40" font-weight="800" fill="#1d2230"><tspan fill="#e5484d">声で主張しあって、見抜け。</tspan></text>
  <text x="64" y="270" font-size="18" fill="#5a6070">似た主張の中のズレを探すうちに、党ごとの違いが見えてくる。</text>

  <!-- ステップ -->
  <g font-size="18" fill="#1d2230">
    <g transform="translate(64,318)">
      <rect width="520" height="64" rx="16" fill="#fff" stroke="#d9dce3" stroke-width="2"/>
      <circle cx="34" cy="32" r="18" fill="#1d2230"/>
      <text x="34" y="39" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text>
      <text x="66" y="29" font-weight="700">3〜8人でマッチング、支持者カードが配られる</text>
      <text x="66" y="51" font-size="14" fill="#8a8f9c">ランダムに選ばれた2党。ウルフは1〜2人</text>
    </g>
    <g transform="translate(64,396)">
      <rect width="520" height="64" rx="16" fill="#fff" stroke="#d9dce3" stroke-width="2"/>
      <circle cx="34" cy="32" r="18" fill="#1d2230"/>
      <text x="34" y="39" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text>
      <text x="66" y="29" font-weight="700">ボイスで3分主張しあい、投票でウルフを見抜く</text>
      <text x="66" y="51" font-size="14" fill="#8a8f9c">テキストチャットはなし。投票は1回</text>
    </g>
    <g transform="translate(64,474)">
      <rect width="520" height="64" rx="16" fill="#fff" stroke="#d9dce3" stroke-width="2"/>
      <circle cx="34" cy="32" r="18" fill="#1d2230"/>
      <text x="34" y="39" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text>
      <text x="66" y="29" font-weight="700">2つの党の主張と、国会での実際の発言を見比べる</text>
      <text x="66" y="51" font-size="14" fill="#8a8f9c">マニフェストと国会会議録を出典つきで</text>
    </g>
  </g>

  <!-- 中央：スマホ（通話・円卓画面） -->
  <g transform="translate(632,70)">
    <rect width="236" height="470" rx="34" fill="#1d2230"/>
    <rect x="9" y="9" width="218" height="452" rx="26" fill="#2a3042"/>
    <text x="118" y="44" font-size="13" fill="#9aa0ad" text-anchor="middle">話し合い　残り</text>
    <text x="118" y="74" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">2:14</text>

    <!-- 円卓 -->
    <circle cx="118" cy="182" r="62" fill="none" stroke="#3d4458" stroke-width="2" stroke-dasharray="4 6"/>
    <g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
      <circle cx="118" cy="104" r="20" fill="#2f7de1" stroke="#3ddc84" stroke-width="4"/><text x="118" y="110">ア</text>
      <circle cx="190" cy="150" r="20" fill="#e0a526"/><text x="190" y="156">イ</text>
      <circle cx="176" cy="236" r="20" fill="#2e9e6a"/><text x="176" y="242">ウ</text>
      <circle cx="60" cy="236" r="20" fill="#9b5de5"/><text x="60" y="242">エ</text>
      <circle cx="46" cy="150" r="20" fill="#e5484d" stroke="#fff" stroke-width="3"/><text x="46" y="156">?</text>
    </g>
    <text x="118" y="188" font-size="12" fill="#9aa0ad" text-anchor="middle">🎙 アが話し中</text>

    <!-- 支持者カード -->
    <rect x="22" y="282" width="192" height="158" rx="14" fill="#fff"/>
    <rect x="22" y="282" width="192" height="34" rx="14" fill="#e5484d"/>
    <rect x="22" y="300" width="192" height="16" fill="#e5484d"/>
    <text x="118" y="305" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">あなたは「A党」の支持者</text>
    <g font-size="12" fill="#1d2230">
      <circle cx="38" cy="338" r="3" fill="#e5484d"/><text x="48" y="342">給付型奨学金を広げる</text>
      <circle cx="38" cy="364" r="3" fill="#e5484d"/><text x="48" y="368">最低賃金を引き上げる</text>
      <circle cx="38" cy="390" r="3" fill="#e5484d"/><text x="48" y="394">部活動を地域に移す</text>
    </g>
    <text x="118" y="426" font-size="11" fill="#8a8f9c" text-anchor="middle">※党名・主張はサンプル</text>
  </g>

  <!-- 矢印 -->
  <path d="M880 300 h22" stroke="#1d2230" stroke-width="4" stroke-linecap="round"/>
  <path d="M898 290 l12 10 l-12 10" fill="none" stroke="#1d2230" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右：振り返りカード -->
  <g transform="translate(922,110)">
    <rect width="226" height="390" rx="22" fill="#fff" stroke="#d9dce3" stroke-width="2"/>
    <text x="113" y="40" font-size="13" fill="#8a8f9c" text-anchor="middle">結果</text>
    <rect x="22" y="54" width="182" height="52" rx="14" fill="#e5484d"/>
    <text x="113" y="88" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">ウルフ発見！</text>

    <text x="22" y="140" font-size="13" font-weight="700" fill="#1d2230">振り返り：2党の主張</text>
    <g font-size="12">
      <rect x="22" y="152" width="86" height="24" rx="12" fill="#fbe5e1"/><text x="65" y="168" fill="#e5484d" font-weight="700" text-anchor="middle">A党</text>
      <rect x="118" y="152" width="86" height="24" rx="12" fill="#e2eefc"/><text x="161" y="168" fill="#2f7de1" font-weight="700" text-anchor="middle">B党</text>
      <text x="65" y="198" fill="#1d2230" text-anchor="middle">給付を広げる</text>
      <text x="161" y="198" fill="#1d2230" text-anchor="middle">貸与を見直す</text>
      <line x1="113" y1="186" x2="113" y2="206" stroke="#d9dce3" stroke-width="2"/>
    </g>

    <line x1="22" y1="224" x2="204" y2="224" stroke="#eef0f4" stroke-width="2"/>
    <text x="22" y="252" font-size="13" font-weight="700" fill="#1d2230">国会での実際の発言</text>
    <rect x="22" y="264" width="182" height="64" rx="10" fill="#f3f4f8"/>
    <text x="34" y="288" font-size="12" fill="#1d2230">「奨学金の返済に苦しむ</text>
    <text x="34" y="308" font-size="12" fill="#1d2230">若者を減らすべきで…」</text>
    <text x="22" y="350" font-size="11" fill="#2f7de1">出典：国会会議録検索システム</text>
    <text x="113" y="374" font-size="11" fill="#8a8f9c" text-anchor="middle">※内容はイメージです</text>
  </g>

  <!-- フッター -->
  <rect x="0" y="600" width="1200" height="75" fill="#1d2230"/>
  <g font-size="16" fill="#fff" font-weight="700">
    <circle cx="92" cy="638" r="5" fill="#3ddc84"/><text x="106" y="644">ボイスのみ・チャットなし</text>
    <circle cx="342" cy="638" r="5" fill="#3ddc84"/><text x="356" y="644">党はランダムに配られる</text>
    <circle cx="582" cy="638" r="5" fill="#3ddc84"/><text x="596" y="644">主張と発言は出典つき</text>
    <circle cx="802" cy="638" r="5" fill="#3ddc84"/><text x="816" y="644">通報で自動停止・二度と同室にしない</text>
  </g>
</svg>
