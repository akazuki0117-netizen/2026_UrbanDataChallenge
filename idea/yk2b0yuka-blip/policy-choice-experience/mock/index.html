<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f8fc">
  <title>もし、あなたが市長なら</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>
  <dialog id="dictionary" aria-labelledby="dict-title">
    <div class="dialog-head"><h2 id="dict-title">単語辞書</h2><button class="icon-button" id="close-dictionary" type="button" aria-label="辞書を閉じる">×</button></div>
    <dl><dt>予算</dt><dd>決められた期間に、事業などに使うお金の計画。このゲームでは架空のポイントで表します。</dd><dt>議会</dt><dd>住民が選んだ議員が、自治体の予算や条例などを話し合う場。</dd><dt>自動運転の実証</dt><dd>安全性や運用上の課題を調べるため、限られた条件で技術を試すこと。</dd></dl>
    <button class="secondary wide" id="close-dictionary-bottom" type="button">とじる</button>
  </dialog>
</body>
</html>
