<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Yu Gothic UI','Meiryo',sans-serif"><title>案 1  議会デスク アイデア概要</title><rect width="1200" height="675" fill="#f9faf8"/><circle cx="1140" cy="0" r="180" fill="#e8f2ed"/><rect x="52" y="54" width="230" height="38" rx="19" fill="#327865"/><text x="167" y="79" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">案 1  議会デスク（仮）</text><text x="52" y="159" font-size="35" font-weight="800" fill="#202a26">机に届く議案を、</text><text x="52" y="211" font-size="35" font-weight="800" fill="#327865">あなたならどう決める？</text><text x="52" y="253" font-size="17" fill="#596a63">決める側となり、二択で任期を進める。</text><g font-size="17" fill="#273831"><rect x="52" y="299" width="497" height="67" rx="14" fill="#fff" stroke="#dae7df" stroke-width="2"/><text x="75" y="326" font-weight="700">01　立場・最初の方針を選ぶ</text><text x="120" y="349" font-size="13" fill="#7b8981">限られた予算で、何を重視する？</text><rect x="52" y="380" width="497" height="67" rx="14" fill="#fff" stroke="#dae7df" stroke-width="2"/><text x="75" y="407" font-weight="700">02　出来事と二択を繰り返す</text><text x="120" y="430" font-size="13" fill="#7b8981">時間が進み、次の議会・次の課題へ</text><rect x="52" y="461" width="497" height="67" rx="14" fill="#fff" stroke="#dae7df" stroke-width="2"/><text x="75" y="488" font-weight="700">03　任期末に経過を振り返る</text><text x="120" y="511" font-size="13" fill="#7b8981">選択の履歴・複数の観点・現実の類似事例</text></g><rect x="642" y="95" width="248" height="418" rx="30" fill="#26312e"/><rect x="649" y="102" width="234" height="404" rx="24" fill="#fff"/><rect x="728" y="108" width="76" height="10" rx="5" fill="#26312e"/><text x="661" y="143" font-size="13" font-weight="700" fill="#327865">市長のデスク　／　２年目</text><rect x="661" y="159" width="210" height="100" rx="8" fill="#e9d3be"/><rect x="672" y="170" width="92" height="45" rx="6" fill="#fffaf5"/><text x="681" y="187" font-size="11" fill="#816e61">今期の方針</text><text x="681" y="203" font-size="11" font-weight="700" fill="#36413c">暮らしを支える</text><rect x="774" y="170" width="87" height="45" rx="6" fill="#fffaf5"/><text x="783" y="187" font-size="11" fill="#816e61">予算</text><text x="783" y="203" font-size="12" fill="#36413c">● ● ○ ○</text><text x="667" y="284" font-size="11" fill="#71817a">新しい出来事</text><text x="667" y="310" font-size="16" font-weight="700" fill="#273831">交通の支援を続ける？</text><rect x="666" y="331" width="201" height="44" rx="12" fill="#327865"/><text x="766" y="359" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">支援を続ける</text><rect x="666" y="384" width="201" height="44" rx="12" fill="#e8f2ed" stroke="#327865"/><text x="766" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#327865">別の方法を検討</text><text x="667" y="461" font-size="12" fill="#75847b">任期 ━━━●━━━━━</text><text x="813" y="482" font-size="12" fill="#327865">単語辞書</text><path d="M902 298h27m-9-8 9 8-9 8" fill="none" stroke="#327865" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="943" y="175" width="205" height="247" rx="17" fill="#fff" stroke="#dae7df" stroke-width="2"/><text x="1046" y="204" text-anchor="middle" font-size="12" fill="#74847c">任期終了後</text><text x="1046" y="231" text-anchor="middle" font-size="16" font-weight="700" fill="#273831">選択のエンドロール</text><path d="M967 252v102" stroke="#b9d2c5" stroke-width="2"/><g font-size="12" fill="#52665c"><circle cx="967" cy="260" r="5" fill="#327865"/><text x="982" y="264">最初の方針を選ぶ</text><circle cx="967" cy="297" r="5" fill="#327865"/><text x="982" y="301">出来事に対応</text><circle cx="967" cy="334" r="5" fill="#327865"/><text x="982" y="338">次の議会で決定</text><text x="982" y="359">……</text><text x="962" y="390" font-weight="700" fill="#327865">多面的に振り返る →</text></g><text x="640" y="512" font-size="12" fill="#7b8981">※スマホ縦画面のイメージ／選択肢は架空</text><rect x="628" y="535" width="500" height="50" rx="12" fill="#fff" stroke="#d9e5de"/><text x="648" y="556" font-size="12" fill="#708278">任期終了後のエンドロール</text><text x="648" y="575" font-size="13" font-weight="700" fill="#327865">方針 → 出来事 → 対応 → 次の議会 → …… → 振り返り</text><rect y="608" width="1200" height="67" fill="#24332e"/><text x="60" y="650" font-size="15" font-weight="700" fill="#fff">● 二択で進める　　　● 単語辞書　　　● ゲーム内の政策・結果は架空</text></svg>