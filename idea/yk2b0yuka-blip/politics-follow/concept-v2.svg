<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Yu Gothic UI','Meiryo',sans-serif"><title>政治のつづき コンセプト</title><rect width="1600" height="900" fill="#f6f9fc"/><text x="70" y="70" fill="#1060b3" font-size="21" font-weight="700">政治のつづき（仮）</text><text x="70" y="142" fill="#142c4a" font-size="42" font-weight="800">選挙のあとも、気になることを。</text><text x="70" y="187" fill="#617a8c" font-size="20">国会の動きをニュースのように読み、気になる対象を追いかける。</text><line x1="70" y1="220" x2="1530" y2="220" stroke="#d9e7f0" stroke-width="2"/><g fill="#183c58" font-weight="700"><text x="192" y="270" font-size="22">01　ホーム</text><text x="672" y="270" font-size="22">02　フォロー</text><text x="1140" y="270" font-size="22">03　話題の詳細</text></g><g><rect x="120" y="295" width="370" height="450" rx="24" fill="#fff" stroke="#dce8f0" stroke-width="2"/><text x="145" y="337" font-size="19" font-weight="700" fill="#153e58">新しい動きを見る</text><text x="145" y="365" font-size="14" fill="#71899a">フォローに限らず話題を発見</text><rect x="145" y="390" width="320" height="115" rx="13" fill="#f4fafc" stroke="#d5e6ee"/><text x="162" y="420" font-size="13" fill="#218291">話題</text><text x="162" y="447" font-size="17" font-weight="700" fill="#142c4a">食料品の消費税</text><text x="162" y="475" font-size="13" fill="#71899a">国会の動きを見る</text><image x="359" y="405" width="86" height="78" xlink:href="data:image/svg+xml;base64,"/><rect x="145" y="518" width="320" height="56" rx="12" fill="#fff" stroke="#dce8f0"/><text x="162" y="551" font-size="15" fill="#274962">教育と学ぶ環境</text><rect x="145" y="586" width="320" height="56" rx="12" fill="#fff" stroke="#dce8f0"/><text x="162" y="619" font-size="15" fill="#274962">子育て支援について</text><text x="145" y="699" font-size="13" fill="#7b919f">画面例：5件の固定サンプル</text></g><g><rect x="615" y="295" width="370" height="450" rx="24" fill="#fff" stroke="#dce8f0" stroke-width="2"/><text x="640" y="337" font-size="19" font-weight="700" fill="#153e58">フォロー中</text><text x="640" y="365" font-size="14" fill="#71899a">気になる対象を縦に一覧</text><rect x="640" y="390" width="320" height="70" rx="12" fill="#fff" stroke="#dce8f0"/><image x="651" y="397" width="60" height="56" xlink:href="data:image/svg+xml;base64,"/><text x="720" y="421" font-size="12" fill="#218291">話題</text><text x="720" y="443" font-size="15" font-weight="700" fill="#142c4a">食料品の消費税</text><rect x="640" y="472" width="320" height="54" rx="12" fill="#fff" stroke="#dce8f0"/><text x="657" y="505" font-size="15" fill="#274962">話題　教育と学ぶ環境</text><rect x="640" y="538" width="320" height="54" rx="12" fill="#fff" stroke="#dce8f0"/><text x="657" y="571" font-size="15" fill="#274962">人　　国会議員A（架空）</text><rect x="640" y="604" width="320" height="54" rx="12" fill="#fff" stroke="#dce8f0"/><text x="657" y="637" font-size="15" fill="#274962">公約　働き方に関する公約</text><text x="640" y="699" font-size="13" fill="#7b919f">話題・人・政策・公約を追う想定</text></g><g><rect x="1110" y="295" width="370" height="450" rx="24" fill="#fff" stroke="#dce8f0" stroke-width="2"/><text x="1135" y="337" font-size="19" font-weight="700" fill="#153e58">食料品の消費税</text><text x="1135" y="365" font-size="14" fill="#71899a">フォロー中　✓</text><rect x="1135" y="385" width="320" height="138" rx="12" fill="#f6fafc"/><text x="1151" y="414" font-size="16" font-weight="700" fill="#1a425d">これまでの動き</text><text x="1151" y="445" font-size="14" fill="#526e80">・法案を衆議院で受理</text><text x="1151" y="471" font-size="14" fill="#526e80">・衆議院で可決</text><text x="1151" y="497" font-size="14" fill="#526e80">・参議院の委員会に付託</text><text x="1135" y="545" font-size="12" fill="#71899a">↑ この領域だけスクロール</text><image x="1135" y="557" width="58" height="58" xlink:href="data:image/svg+xml;base64,"/><rect x="1200" y="568" width="112" height="38" rx="19" fill="#fff" stroke="#9bc5e6"/><text x="1256" y="592" text-anchor="middle" font-size="13" fill="#14548e">これって何？</text><rect x="1319" y="568" width="136" height="38" rx="19" fill="#fff" stroke="#9bc5e6"/><text x="1387" y="592" text-anchor="middle" font-size="13" fill="#14548e">もう決まった？</text><rect x="1135" y="627" width="320" height="43" rx="10" fill="#ecf7f9"/><text x="1150" y="653" font-size="13" fill="#2a687b">Tips　海外の関連事例　›</text><text x="1135" y="699" font-size="13" fill="#7b919f">博士・Tipsは画面内に固定</text></g><text x="70" y="835" font-size="16" fill="#657e8e">※ 画面は検討中のイメージ。モックの情報は2026年11月26日確認時点の固定サンプルです。</text></svg>