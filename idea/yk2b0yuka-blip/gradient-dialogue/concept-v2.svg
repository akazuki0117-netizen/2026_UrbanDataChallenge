<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Yu Gothic UI','Meiryo',sans-serif"><title>グラデーションの広場 コンセプト</title><rect width="1600" height="900" fill="#f6f9fc"/><text x="70" y="75" font-size="22" font-weight="700" fill="#1261bd">グラデーションの広場（仮）</text><text x="70" y="147" font-size="42" font-weight="800" fill="#122a4b">ちがいを見つけて、話してみよう。</text><text x="70" y="191" font-size="21" fill="#61798a">スライダーに考えを置き、匿名のコメントから会話を始める。</text><line x1="70" y1="224" x2="1530" y2="224" stroke="#d9e7ef" stroke-width="2"/><g font-size="22" font-weight="700" fill="#183c58"><text x="192" y="270">01　回答する</text><text x="672" y="270">02　回答を待つ</text><text x="1140" y="270">03　結果を見て話す</text></g><g><rect x="120" y="295" width="370" height="450" rx="24" fill="#fff" stroke="#dce8f0" stroke-width="2"/><text x="145" y="337" font-size="19" font-weight="700" fill="#153e58">お題について考える</text><text x="145" y="369" font-size="15" fill="#526e80">食料品の消費税率を</text><text x="145" y="393" font-size="15" fill="#526e80">どうしたい？</text><line x1="157" y1="452" x2="453" y2="452" stroke="#c6dce9" stroke-width="7" stroke-linecap="round"/><line x1="157" y1="452" x2="303" y2="452" stroke="#2a9e9c" stroke-width="7" stroke-linecap="round"/><circle cx="303" cy="452" r="10" fill="#fff" stroke="#1261bd" stroke-width="3"/><text x="145" y="485" font-size="12" fill="#617b8c">引き上げる</text><text x="302" y="485" text-anchor="middle" font-size="12" fill="#617b8c">現在のまま</text><text x="465" y="485" text-anchor="end" font-size="12" fill="#617b8c">0％にする</text><rect x="145" y="509" width="320" height="42" rx="11" fill="#fff" stroke="#bcd3e4"/><text x="305" y="535" text-anchor="middle" font-size="14" fill="#315c78">まだ分からない</text><rect x="145" y="571" width="320" height="72" rx="11" fill="#f8fbfd" stroke="#dce8f0"/><text x="160" y="600" font-size="14" fill="#7b919f">ひとこと（任意）</text><rect x="145" y="659" width="320" height="46" rx="12" fill="#1261bd"/><text x="305" y="687" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">回答する</text></g><g><rect x="615" y="295" width="370" height="450" rx="24" fill="#fff" stroke="#dce8f0" stroke-width="2"/><text x="640" y="337" font-size="19" font-weight="700" fill="#153e58">回答を受け付けました</text><text x="640" y="370" font-size="14" fill="#71899a">みんなの回答を待っています</text><circle cx="780" cy="470" r="10" fill="#72bbbf"/><circle cx="815" cy="470" r="10" fill="#72bbbf"/><circle cx="850" cy="470" r="10" fill="#b9dce2"/><text x="800" y="525" text-anchor="middle" font-size="18" font-weight="700" fill="#153e58">回答中…</text><text x="640" y="617" font-size="15" fill="#526e80">全員が答えるまで、</text><text x="640" y="647" font-size="15" fill="#526e80">ほかの人の回答は見えません。</text><text x="640" y="699" font-size="13" fill="#7b919f">回答者数は表示しない</text></g><g><rect x="1110" y="295" width="370" height="450" rx="24" fill="#fff" stroke="#dce8f0" stroke-width="2"/><text x="1135" y="337" font-size="19" font-weight="700" fill="#153e58">みんなの考え</text><text x="1135" y="368" font-size="14" fill="#71899a">全員の回答がそろったら表示</text><rect x="1135" y="391" width="153" height="44" rx="16" fill="#e5f6f5"/><text x="1211" y="418" text-anchor="middle" font-size="13" fill="#326578">財源も気になる</text><rect x="1300" y="409" width="155" height="44" rx="16" fill="#edf5fb"/><text x="1377" y="436" text-anchor="middle" font-size="13" fill="#326578">負担を減らしたい</text><path d="M1148 533C1192 529 1216 510 1254 512S1313 481 1343 493 1402 532 1444 532" fill="none" stroke="#c6e1ec" stroke-width="3"/><g fill="#1261bd"><circle cx="1184" cy="524" r="6"/><circle cx="1251" cy="512" r="6"/><circle cx="1339" cy="493" r="6"/><circle cx="1410" cy="525" r="6"/></g><line x1="1145" y1="550" x2="1450" y2="550" stroke="#91bfc9" stroke-width="2"/><text x="1140" y="574" font-size="12" fill="#71899a">引き上げる</text><text x="1298" y="574" text-anchor="middle" font-size="12" fill="#71899a">現在のまま</text><text x="1455" y="574" text-anchor="end" font-size="12" fill="#71899a">0％にする</text><rect x="1212" y="592" width="170" height="42" rx="15" fill="#e5f6f5"/><text x="1297" y="618" text-anchor="middle" font-size="13" fill="#326578">期間も気になる</text><text x="1135" y="676" font-size="14" fill="#526e80">分布と匿名コメントから話し始める</text><text x="1135" y="706" font-size="13" fill="#7b919f">全体との比較方法は検討中</text></g><text x="70" y="835" font-size="16" fill="#657e8e">※ 画面・回答は架空のイメージ。少人数の分布表示や匿名性は検討中です。</text></svg>